<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Garage Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        button {
            font-size: 18px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.2s;
        }
        .btn-open {
            background-color: #28a745; /* Зелен бутон за отваряне */
        }
        .btn-open:hover {
            background-color: #218838;
        }
        .btn-close {
            background-color: #dc3545; /* Червен бутон за затваряне */
        }
        .btn-close:hover {
            background-color: #c82333;
        }
        #status-text {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Garage Gateway</h1>
        <p>Контролирай гаражната врата ръчно:</p>
        
        <!-- Двата бутона -->
        <button class="btn-open" onclick="sendGarageCommand('UNLOCK_REQUESTED')">Open Garage</button>
        <button class="btn-close" onclick="sendGarageCommand('LOCKED')">Close Garage</button>
        
        <div id="status-text">Статус: Изчакване на команда...</div>
    </div>

    <script>
        const firebaseURL = "https://parkshare-bg-default-rtdb.europe-west1.firebasedatabase.app/garages/garage_01.json";

        function sendGarageCommand(statusValue) {
            const statusText = document.getElementById("status-text");
            statusText.innerText = "Изпращане на команда: " + statusValue + "...";

            fetch(firebaseURL, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: statusValue })
            })
            .then(response => {
                if (response.ok) {
                    if (statusValue === 'UNLOCK_REQUESTED') {
                        statusText.innerText = "Статус: Вратата е ОТВОРЕНА (Очаква затваряне)";
                        statusText.style.color = "green";
                    } else {
                        statusText.innerText = "Статус: Вратата е ЗАТВОРЕНА";
                        statusText.style.color = "red";
                    }
                } else {
                    statusText.innerText = "Грешка при връзка с Firebase!";
                    statusText.style.color = "orange";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                statusText.innerText = "Грешка в мрежата!";
                statusText.style.color = "red";
            });
        }
    </script>

</body>
</html>
