<div style="text-align: center; margin-top: 50px;">
    <h2>Garage Control Panel</h2>
    <br>
    <!-- Open Button -->
    <button onclick="sendGarageCommand('UNLOCK_REQUESTED')" style="padding: 15px 30px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">
        Open Garage
    </button>
    
    <!-- Close Button -->
    <button onclick="sendGarageCommand('LOCKED')" style="padding: 15px 30px; font-size: 18px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Close Garage
    </button>
</div>

<script>
  const firebaseURL = "https://parkshare-bg-default-rtdb.europe-west1.firebasedatabase.app/garages/garage_01.json";

  function sendGarageCommand(statusValue) {
    fetch(firebaseURL, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: statusValue })
    })
    .then(response => response.json())
    .then(data => {
      console.log('Command sent successfully:', statusValue);
    })
    .catch((error) => {
      console.error('Error sending command:', error);
    });
  }
</script>
